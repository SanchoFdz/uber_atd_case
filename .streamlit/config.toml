[theme]
base = "light"
primaryColor = "#3FC060"
backgroundColor = "#F9FFF9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#000000"
font = "sans serif"

[server]
headless = true
runOnSave = true
port = 8501
enableCORS = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true
showErrorDetails = false
